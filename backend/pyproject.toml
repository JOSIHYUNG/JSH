[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jsh-backend"
version = "0.1.0"
description = "FastAPI backend for the JSH project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.140,<0.141",
    "sqlmodel>=0.0.39,<0.1",
    "alembic>=1.18,<1.19",
    "pydantic-settings>=2.14,<3",
    "openai>=2.50,<3",
    "pypdf>=6.14,<7",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=9.1,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
